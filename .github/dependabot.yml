# Atualizações propostas em PR, para não dependerem de alguém se lembrar.
#
# A aplicação não tem dependências de execução (ADR-0002); o que aqui se
# atualiza são as ferramentas de desenvolvimento, testes e empacotamento, e as
# Actions do CI — que estão fixadas por SHA e, sem isto, ficariam paradas.
version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

  # A plataforma web (ADR-0017). As atualizações menores e de correção chegam
  # num só PR por semana: verificam-se juntas, com um CI, em vez de uma a uma
  # (skill `dependencias`). As de versão maior vêm sozinhas, porque podem
  # partir a API.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-menores:
        update-types: [minor, patch]
