name: Release

# Uma release sai quando alguém marca uma versão, e não a cada integração:
# isto instala-se em máquinas de clientes, e cada versão publicada é uma
# versão que alguém pode ter. `git tag v1.0.1 && git push origin v1.0.1`.
on:
  push:
    tags:
      - "v*"
  # Ensaio: corre a release inteira **menos publicar**. Existe para a próxima
  # etiqueta não ser a primeira vez que este caminho é percorrido — e porque o
  # runner descarrega todas as Actions do job antes de correr o primeiro passo,
  # um ensaio apanha um SHA que deixou de existir, que foi exatamente o que
  # aconteceu ao `action-gh-release` entre a 1.1.0 e hoje.
  workflow_dispatch:

permissions:
  contents: write # necessário para criar a release e anexar o instalador

jobs:
  publicar:
    name: Instalador Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # Numa etiqueta, a versão é a etiqueta. Num ensaio não há etiqueta
      # nenhuma de onde a tirar, e usa-se a que o código declara.
      - name: Versão desta execução
        id: versao
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $etiqueta = "${{ github.ref_name }}"
          } else {
            $declarada = python -c "import sys; sys.path.insert(0, 'src'); from core.version import APP_VERSION; print(APP_VERSION)"
            $etiqueta = "v$declarada"
          }
          "etiqueta=$etiqueta" >> $env:GITHUB_OUTPUT
          "versao=$($etiqueta -replace '^v', '')" >> $env:GITHUB_OUTPUT
          Write-Host "Versão desta execução: $etiqueta"

      # Primeiro de tudo, e antes de construir seja o que for: uma etiqueta
      # que não bata certo com core/version.py publica um ficheiro chamado
      # 1.0.1 que instala uma aplicação que se diz 1.0.0.
      #
      # Num ensaio a comparação é trivialmente verdadeira — a etiqueta veio do
      # próprio `core/version.py`. Corre à mesma: o que o ensaio prova aqui é
      # que o script existe e responde, não que a versão está certa.
      - name: A etiqueta diz o mesmo que o código
        run: python tools/verificar_versao.py "${{ steps.versao.outputs.etiqueta }}"

      - name: Testes
        run: python -m pytest -q

      # tools/build.py só termina com sucesso depois de correr o .exe gerado
      # com --version e --autoteste.
      - name: Construir e validar o executável
        run: python tools/build.py

      # Os dois ensaios que protegem quem já tem a aplicação instalada. Correm
      # semanalmente no outro workflow; aqui correm **sempre**, porque uma
      # release é exatamente o momento em que eles importam.
      - name: Atualização preserva os dados do utilizador
        run: python tools/testar_atualizacao.py

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construir o instalador
        run: python tools/build_installer.py

      - name: Instalador de ponta a ponta
        run: python tools/testar_instalador.py

      # O nome do ficheiro leva a versão; o do build não leva, e não se muda
      # porque `testar_instalador.py` conta com ele. Quem tiver dois downloads
      # na pasta precisa de os distinguir sem os abrir.
      - name: Dar o nome da versão ao ficheiro
        shell: pwsh
        run: |
          $versao = "${{ steps.versao.outputs.versao }}"
          Copy-Item installer/Output/GerenciadorDeTarefas-Setup.exe `
                    "installer/Output/GerenciadorDeTarefas-Setup-$versao.exe"

      # As notas vivem no CHANGELOG.md e sao revistas como tudo o resto, em vez
      # de escritas a pressa na caixa do GitHub no momento de publicar.
      # Num ensaio isto também corre, e é um dos passos que mais vale ensaiar:
      # falha quando o CHANGELOG não tem secção para a versão que o código
      # declara — ou seja, quando a release ainda não está pronta para sair.
      - name: Notas desta versao
        run: python tools/notas_da_versao.py "${{ steps.versao.outputs.etiqueta }}" --para notas.md

      # O único passo que um ensaio não faz. Tudo acima já correu; o que fica
      # por exercitar é a criação da release em si.
      - name: Publicar a release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: installer/Output/GerenciadorDeTarefas-Setup-*.exe
          generate_release_notes: true
          # Uma etiqueta com sufixo (v1.1.0-beta) sai marcada como
          # pré-lançamento, para não aparecer como a versão a descarregar.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notas.md
