name: Testes

on:
  push:
  pull_request:

jobs:
  testes:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # A aplicação é Tkinter: no Linux é preciso o Tk e um servidor X virtual.
      # Sem eles, os testes de interface são ignorados em vez de falharem.
      - name: Instalar Tk e Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest

      - name: Testes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest

      - name: Autoteste da aplicação (Windows)
        if: runner.os == 'Windows'
        run: python src/main.py --autoteste

  empacotamento:
    name: Executável Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # tools/build.py só termina com sucesso depois de executar o .exe
      # gerado com --version e --autoteste.
      - name: Construir e validar o executável
        run: python tools/build.py

      - name: Publicar o executável
        uses: actions/upload-artifact@v4
        with:
          name: GerenciadorDeTarefas-windows
          path: dist/GerenciadorDeTarefas/
          retention-days: 7
