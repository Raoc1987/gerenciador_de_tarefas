name: Testes

on:
  push:
  pull_request:
  # A suíte também corre sem depender de haver commits: uma dependência de
  # desenvolvimento ou uma imagem de runner podem partir o build sozinhas.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Nenhum job deste workflow escreve no repositório.
permissions:
  contents: read

jobs:
  testes:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.13"]

    steps:
      # As Actions são fixadas por SHA: uma etiqueta móvel pode passar a
      # apontar para outro código sem nada mudar aqui.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Preparar Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # A aplicação é Tkinter: no Linux é preciso o Tk e um servidor X virtual.
      # Sem eles, os testes de interface são ignorados em vez de falharem.
      - name: Instalar Tk e Xvfb (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb

      - name: Instalar dependências
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt

      - name: Testes (Windows)
        if: runner.os == 'Windows'
        run: python -m pytest --cov=src --cov-report=term-missing

      - name: Testes (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest --cov=src --cov-report=term-missing

      - name: Autoteste da aplicação (Windows)
        if: runner.os == 'Windows'
        run: python src/main.py --autoteste

  empacotamento:
    name: Executável Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # tools/build.py só termina com sucesso depois de executar o .exe
      # gerado com --version e --autoteste.
      - name: Construir e validar o executável
        run: python tools/build.py

      - name: Publicar o executável
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GerenciadorDeTarefas-windows
          path: dist/GerenciadorDeTarefas/
          retention-days: 7

  # Os dois ensaios que protegem os dados de quem já tem a aplicação
  # instalada. Constroem executáveis várias vezes e instalam software na
  # máquina, por isso não correm a cada PR: correm na execução semanal e
  # podem ser pedidos à mão antes de uma release (workflow_dispatch).
  ensaios:
    name: Ensaios de atualização e instalador
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      # Substitui os arquivos da aplicação como o instalador faria e confirma
      # que tarefas, configuração e plugins sobrevivem. Não precisa do Inno Setup.
      - name: Atualização preserva os dados do utilizador
        run: python tools/testar_atualizacao.py

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      # Instalação limpa, atualização, desinstalação com e sem /REMOVEDATA.
      # O script aborta se a pasta de dados real já existir — num runner
      # limpo não existe.
      - name: Instalador de ponta a ponta
        run: python tools/testar_instalador.py
